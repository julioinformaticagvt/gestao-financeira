<head>

  <meta name="theme-color" content="#151a18">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Gestão financeira</title>
  <!-- Estilos, nesta ordem (os últimos podem ajustar os primeiros). Se mudar a lista, atualize tests/frame.html também. -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">

<body>
  <header class="topbar">
    <span class="brand"><img id="brand-logo" class="brand-logo" alt="" hidden><span id="brand-name">Meu negócio</span></span>
    <nav id="nav" aria-label="Menu principal"><button class="active" data-view="dashboard">Visão geral</button><button data-view="sales">Vendas</button><button data-view="quotes">Orçamentos</button><button data-view="clients">Clientes</button><button data-view="products">Produtos</button><button data-view="financial">Financeiro</button><button class="nav-secondary" data-view="settings" title="Configurações">Configurações</button></nav>
    <span id="sync-top" class="sync-ind sync-top" data-action="sync-open" hidden></span>
    <button class="help-btn" data-action="open-help" title="Como usar" aria-label="Como usar">?</button>
    <button class="receive" data-action="new-payment">Registrar pagamento</button>
    <button class="primary" data-action="new-sale">Nova venda</button>
  </header>
  <div id="sync-band" class="sync-band" hidden></div>
  <main class="main">
    <div class="page-head"><h1 id="page-title">Visão geral</h1></div>
    <div id="subtabs" class="subtabs" hidden></div>
    <div id="app"></div>
    <footer class="page-foot"><span class="status-dot"></span>Dados salvos neste aparelho<span id="sync-indicator" class="sync-ind" data-action="sync-open" hidden></span><span id="app-version" class="app-version"></span></footer>
  </main>
  <div id="modal" class="modal hidden"><div class="modal-card"><button class="close" data-action="close-modal">×</button><div id="modal-content"></div></div></div>
